[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ilm"
version = "0.1.0"
description = "Post-training for concentrated circuits in LLMs (Edge-Pruning co-training)."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["ilm", "ilm.data", "ilm.masking", "ilm.training", "ilm.eval"]
