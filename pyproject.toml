[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-condensation"
version = "0.2.0"
description = "Circuit Condensation: post-training that concentrates a behavior's causal circuit."
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "transformers>=4.51", "peft>=0.13"]

[tool.setuptools]
packages = ["ilm", "ilm.data", "ilm.discovery", "ilm.eval", "ilm.masking", "ilm.training"]
